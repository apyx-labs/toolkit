[package]
name                 = "apyx-reqwest-middleware"
version              = "0.1.0"
edition.workspace    = true
license.workspace    = true
repository.workspace = true
description          = "reqwest middleware: header auth, URL rebasing, Prometheus client metrics"

[dependencies]
# Workspace deps (no extra features)
async-trait.workspace        = true
http.workspace               = true
prometheus-client.workspace  = true
reqwest.workspace            = true
reqwest-middleware.workspace = true

[dev-dependencies]
reqwest-retry      = { workspace = true, features = ["default"] }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
